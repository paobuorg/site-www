name: Publish shared core artifact

on:
  push:
    tags: ['core-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.18.3'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches core version
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          EXPECTED="core-v$VERSION"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $EXPECTED."
            exit 1
          fi

      - name: Pack core
        run: pnpm core:pack

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            core-dist/paobu-core-*.tgz \
            core-dist/paobu-core-*.tgz.sha256 \
            core-dist/core.lock.json \
            --title "@paobu/core $GITHUB_REF_NAME" \
            --notes "Shared core artifact for RunMap sites. Verify the SHA-256 before use."
