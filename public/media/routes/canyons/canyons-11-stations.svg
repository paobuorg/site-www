<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1560" viewBox="0 0 720 1560" role="img" aria-labelledby="title desc">
  <title id="title">Canyons 100K 2026 aid chart: eleven stations in official order</title>
  <desc id="desc">Eleven equal-width station rows in official chart order: Start China Wall 0.0 km; Deadwood-1 18.0 km; Swinging Bridge 21.7 km; Deadwood-2 25.4 km; Michigan Bluff 36.4 km; Foresthill 45.9 km; Cal 2 59.1 km; Drivers Flat 74.0 km; Mammoth Bar 86.7 km; Confluence 92.7 km; and Finish Downtown Auburn 99.1 km. Rows show segment distance, cumulative gain and loss, published cut-off and crew or drop-bag access. The chart is the 2026 metric aid chart and the organiser says it will change for 2027. Rows are equally spaced and are not a map, not a distance-scaled profile and not navigable.</desc>
