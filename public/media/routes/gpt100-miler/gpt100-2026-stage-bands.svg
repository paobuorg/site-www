<text x="58" y="711" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#1f2a24">Griffin Fireline → Dunkeld</text>
<text x="328" y="711" text-anchor="end" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="700" fill="#6f6650">130.7 → 163.0 km</text>
