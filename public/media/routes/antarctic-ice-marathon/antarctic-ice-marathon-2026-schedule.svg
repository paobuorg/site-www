nchor="start">Depart Chile</text><rect x="44" y="486" width="296" height="40" rx="6" fill="#fbf3ee" stroke="#e2c5b8" stroke-width="1"/><text x="52" y="503" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="7.8" font-weight="700" fill="#a85c3a" text-anchor="start">RACE-DAY LIMIT: 10 h · start time not published</text><text x="52" y="517" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="7.2" font-weight="400" fill="#5d675f" text-anchor="start">10 h for 42.195 km is 14:14 /km; cold exposure matters more than pace.</text><text x="20" y="552" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="7.4" font-weight="400" fill="#5d675f" text-anchor="start">FAQ advises at least two weeks of buffer after the event because</text><text x="20" y="566" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="7.4" font-weight="400" fill="#5d675f" text-anchor="start">weather, aircraft availability and local conditions can delay flights by days.</text><line x1="20" y1="562" x2="340" y2="562" stroke="#d8d0c0" stroke-width="1"/><text x="20" y="576" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="7.4" font-weight="400" fill="#5d675f" text-anchor="start">Official provisional schedule · not a flight timetable · dates can shift</text></svg>
