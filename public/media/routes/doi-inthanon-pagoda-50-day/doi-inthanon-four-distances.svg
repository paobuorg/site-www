<svg xmlns="http://www.w3.org/2000/svg" width="360" height="720" viewBox="0 0 360 720" role="img" aria-labelledby="title desc">
  <title id="title">Doi Inthanon PAGODA 50-DAY 2026: four distance readings</title>
  <desc id="desc">Four bars compare 57.000 km on the official race page, 56.700 km at the finish of the official time chart, 56.795 km from the official GPX in three dimensions and 55.736 km from the same GPX in two dimensions. The scale runs from 54 to 58 km, deliberately not from zero, so the bars exaggerate the sub-1.3 km differences; the labels are the exact figures. The official page gives 3,600 m of gain; the GPX gives 3,606 m raw positive change and 3,558 m with a 3 m threshold. A dashed line marks 57.000 km. The graphic is schematic, not a course profile, map or pacing plan.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="360" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07121A"/>
      <stop offset="0.55" stop-color="#0D1926"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
  </defs>
  <rect width="360" height="720" fill="url(#bg)"/>
  <circle cx="326" cy="46" r="98" fill="#F4B860" opacity="0.06"/>
  <circle cx="30" cy="680" r="92" fill="#5FD3C4" opacity="0.05"/>
  <g font-family="Inter, 'Segoe UI', 'Noto Sans SC', sans-serif">
    <text x="12" y="30" fill="#F4B860" font-size="14" font-weight="700" letter-spacing="1.5">DOI INTHANON / PAGODA 50-DAY 2026</text>
    <text x="12" y="70" fill="#F4FFFC" font-size="27" font-weight="750">四套距离</text>
    <text x="12" y="96" fill="#F4FFFC" font-size="17" font-weight="750">Four distance readings</text>
    <text x="12" y="122" fill="#91A8B8" font-size="12">57.000 · 56.700 · 56.795 · 55.736 km</text>
    <text x="12" y="146" fill="#FFB38A" font-size="11.5">刻度 54–58 km，不是零基线；条形放大了不到 1.3 km 的差</text>
    <text x="12" y="166" fill="#6E8494" font-size="11">A non-zero scale; exact labels, exaggerated bars.</text>
    <text x="264.0" y="198" fill="#F4B860" font-size="11" text-anchor="middle">57.000 基准</text>
  </g>
  <line x1="264.0" y1="206" x2="264.0" y2="572" stroke="#F4B860" stroke-width="1" stroke-dasharray="4 5" opacity="0.6"/>
  <g font-family="Inter, 'Segoe UI', 'Noto Sans SC', sans-serif">
    <g transform="translate(12,222)">
      <text x="0" y="0" fill="#F4FFFC" font-size="12.5" font-weight="700">赛事页 / race page</text>
      <text x="336" y="0" fill="#F4FFFC" font-size="17" font-weight="750" text-anchor="end">57.000 km</text>
      <rect x="0" y="12" width="336" height="15" rx="7.5" fill="#13263A"/>
      <rect x="0" y="12" width="252.0" height="15" rx="7.5" fill="#F4B860"/>
      <text x="0" y="42" fill="#FFB38A" font-size="11.5">3,600 m+</text>
      <text x="0" y="61" fill="#6E8494" font-size="10.8">官方距离栏 / official distance field</text>
    </g>
    <g transform="translate(12,320)">
      <text x="0" y="0" fill="#F4FFFC" font-size="12.5" font-weight="700">官方时间图 / time chart</text>
      <text x="336" y="0" fill="#F4FFFC" font-size="17" font-weight="750" text-anchor="end">56.700 km</text>
      <rect x="0" y="12" width="336" height="15" rx="7.5" fill="#13263A"/>
      <rect x="0" y="12" width="226.8" height="15" rx="7.5" fill="#5FD3C4"/>
      <text x="0" y="42" fill="#FFB38A" font-size="11.5">终点累计 / finish cumulative</text>
      <text x="0" y="61" fill="#6E8494" font-size="10.8">与赛事页差 0.300 km</text>
    </g>
    <g transform="translate(12,418)">
      <text x="0" y="0" fill="#F4FFFC" font-size="12.5" font-weight="700">GPX 三维 / 3D</text>
      <text x="336" y="0" fill="#F4FFFC" font-size="17" font-weight="750" text-anchor="end">56.795 km</text>
      <rect x="0" y="12" width="336" height="15" rx="7.5" fill="#13263A"/>
      <rect x="0" y="12" width="234.8" height="15" rx="7.5" fill="#8FD3FF"/>
      <text x="0" y="42" fill="#FFB38A" font-size="11.5">3,606 m 原始 / raw</text>
      <text x="0" y="61" fill="#6E8494" font-size="10.8">3,990 点，加高程 / with elevation</text>
    </g>
    <g transform="translate(12,516)">
      <text x="0" y="0" fill="#F4FFFC" font-size="12.5" font-weight="700">GPX 二维 / 2D</text>
      <text x="336" y="0" fill="#F4FFFC" font-size="17" font-weight="750" text-anchor="end">55.736 km</text>
      <rect x="0" y="12" width="336" height="15" rx="7.5" fill="#13263A"/>
      <rect x="0" y="12" width="145.8" height="15" rx="7.5" fill="#FF8A5B"/>
      <text x="0" y="42" fill="#FFB38A" font-size="11.5">不加高程 / horizontal only</text>
      <text x="0" y="61" fill="#6E8494" font-size="10.8">同文件最短读数 / shortest reading</text>
    </g>
  </g>
  <g font-family="Inter, 'Segoe UI', 'Noto Sans SC', sans-serif">
    <line x1="12" y1="598" x2="348" y2="598" stroke="#20374A" stroke-width="1"/>
    <text x="12" y="624" fill="#F4B860" font-size="13" font-weight="700">最长与最短相差 1.264 km</text>
    <text x="12" y="645" fill="#91A8B8" font-size="11.5">官方没有解释 50、56.7 与 57 的差异；本图不平均、不替官方选值。</text>
    <text x="12" y="667" fill="#6E8494" font-size="11">GPX 日期 2026-09-25；官方未声明它是比赛日最终线路。</text>
    <text x="12" y="689" fill="#6E8494" font-size="11">GPX 只外链；图形不是赛道剖面、地图或配速计划。</text>
    <text x="12" y="711" fill="#6E8494" font-size="10">Editorial graphic · CC BY 4.0 · not an official map</text>
  </g>
</svg>
