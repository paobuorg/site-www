<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1330" viewBox="0 0 720 1330" role="img" aria-labelledby="title desc">
  <title id="title">CCC 2026: the ten official timing points</title>
  <desc id="desc">Ten cards in official order from Courmayeur to Chamonix: Courmayeur 0 km, Refuge Bertone 13.6 km, Arnouvaz 26.3 km, La Fouly 40.7 km, Champex-Lac 54.2 km, Plan de l'Au 59.1 km, Martigny 69.2 km, Trient 79.1 km, Vallorcine 90.1 km and Chamonix 107.8 km. Cards show cumulative and segment gain/loss, altitude and cut-off. Cards are equally spaced and do not represent distance; this is not a map and cannot be used for navigation.</desc>
