    <linearGradient id="bg" x1="0" y1="0" x2="720" y2="890" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07121A"/>
      <stop offset="0.55" stop-color="#0D1926"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="228" x2="0" y2="714" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5FD3C4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5FD3C4" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
