<svg xmlns="http://www.w3.org/2000/svg" width="720" height="890" viewBox="0 0 720 890" role="img" aria-labelledby="title desc">
  <title id="title">CCC 2026: elevation at the ten official timing points</title>
  <desc id="desc">Profile of the ten official 2026 CCC timing points: Courmayeur 1,221 m, Refuge Bertone 1,982 m, Arnouvaz 1,777 m, La Fouly 1,604 m, Champex-Lac 1,472 m, Plan de l'Au 1,340 m, Martigny 507 m, Trient 1,304 m, Vallorcine 1,260 m and Chamonix 1,035 m. The highest timing point is Refuge Bertone at 1,982 m and the lowest is Martigny at 507 m. Grand Col Ferret, about 2,500 m, lies between Arnouvaz and La Fouly but is not a timing point, so it is not on the line. The line connects only timing points and is not a full GPX profile or a navigable track.</desc>
