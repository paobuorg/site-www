<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1880" viewBox="0 0 480 1880" role="img" aria-labelledby="title desc">
  <title id="title">Tarawera TMiler 2027: sixteen timing points in official order</title>
  <desc id="desc">Sixteen equal-width cards in official timing-table order from Te Puia at 0.0 km to Village Green at 163.0 km, with segment distance, cumulative distance, published cut-off and the services listed for that point. Points without a cut-off are marked not published. The cards are not a map, not a distance-scaled profile and not navigable. Cut-offs are leave-by limits, not target paces. The 2027 page may update the table.</desc>
