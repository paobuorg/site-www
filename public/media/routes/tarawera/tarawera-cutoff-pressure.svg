<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1330" viewBox="0 0 480 1330" role="img" aria-labelledby="title desc">
  <title id="title">Tarawera TMiler 2027: implied average speed between consecutive published cut-offs</title>
  <desc id="desc">Twelve bars show distance divided by the time between consecutive published cut-offs, from Buried Village at 29.9 km to the finish at 163.0 km. Most intervals sit near 4.5 km/h. Okataina to Millar implies 3.83 km/h over 15.3 km and four hours, the slowest interval. Millar to Tikitapu implies 6.00 km/h over 12.0 km and two hours, the fastest. The two intervals together average 4.55 km/h over 27.3 km and six hours, close to the 36-hour overall 4.53 km/h; the issue is the uneven split, not the average. Cut-offs are leave-by limits, not target paces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="480" y2="1330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07121A"/>
      <stop offset="0.55" stop-color="#0D1926"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
  </defs>
  <rect width="480" height="1330" fill="url(#bg)"/>
  <circle cx="430" cy="56" r="110" fill="#FF7A6B" opacity="0.05"/>
  <g font-family="Inter, 'Segoe UI', 'Noto Sans SC', sans-serif">
    <text x="14" y="38" fill="#FF9A8A" font-size="16" font-weight="700" letter-spacing="2">TARAWERA / CUT-OFF PRESSURE</text>
    <text x="14" y="82" fill="#F4FFFC" font-size="37" font-weight="750">36-hour limit</text>
    <text x="14" y="120" fill="#F4FFFC" font-size="26" font-weight="700">12 intervals, 12 implied speeds</text>
    <text x="14" y="148" fill="#91A8B8" font-size="17">Distance ÷ time between consecutive cut-offs · km/h</text>
    <text x="14" y="174" fill="#6E8494" font-size="16">Cut-offs are limits, not targets. Axis starts at 0 km/h.</text>
  </g>
  <g font-family="Inter, 'Segoe UI', 'Noto Sans SC', sans-serif">
