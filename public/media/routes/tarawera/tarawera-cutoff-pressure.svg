    <text x="14" y="925" fill="#91A8B8" font-size="16">12.0 km · 2 h 00</text>
    <rect x="14" y="934" width="420" height="16" rx="6" fill="#0A1725"/>
    <rect x="14" y="934" width="360.0" height="16" rx="6" fill="#F4B860"/>
