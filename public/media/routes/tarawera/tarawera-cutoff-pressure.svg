    <line x1="134" y1="266" x2="134" y2="1098" stroke="#1E3547" stroke-width="1"/>
    <text x="134" y="1120" fill="#6E8494" font-size="16" text-anchor="middle">2</text>
    <line x1="254" y1="266" x2="254" y2="1098" stroke="#1E3547" stroke-width="1"/>
    <text x="254" y="1120" fill="#6E8494" font-size="16" text-anchor="middle">4</text>
    <line x1="374" y1="266" x2="374" y2="1098" stroke="#1E3547" stroke-width="1"/>
    <text x="374" y="1120" fill="#6E8494" font-size="16" text-anchor="middle">6</text>
    <text x="224" y="1142" fill="#6E8494" font-size="16" text-anchor="middle">implied km/h</text>
    <text x="14" y="240" fill="#F4FFFC" font-size="18" font-weight="700">Buried Village → Te Ariki</text>
    <text x="14" y="259" fill="#91A8B8" font-size="16">15.6 km · 3 h 25</text>
    <rect x="14" y="268" width="420" height="16" rx="6" fill="#0A1725"/>
    <rect x="14" y="268" width="274.0" height="16" rx="6" fill="#5FD3C4"/>
    <text x="296.0" y="281" fill="#F4FFFC" font-size="17" font-weight="750">4.57</text>
    <text x="14" y="314" fill="#F4FFFC" font-size="18" font-weight="700">Te Ariki → Rerewhakaaitu</text>
    <text x="14" y="333" fill="#91A8B8" font-size="16">10.5 km · 2 h 20</text>
    <rect x="14" y="342" width="420" height="16" rx="6" fill="#0A1725"/>
    <rect x="14" y="342" width="270.0" height="16" rx="6" fill="#5FD3C4"/>
