    <text x="14" y="1054" fill="#F4FFFC" font-size="18" font-weight="700">Redwoods → Village Green</text>
    <text x="14" y="1073" fill="#91A8B8" font-size="16">7.3 km · 1 h 37</text>
    <rect x="14" y="1082" width="420" height="16" rx="6" fill="#0A1725"/>
    <rect x="14" y="1082" width="270.9" height="16" rx="6" fill="#5FD3C4"/>
