    <text x="14" y="999" fill="#91A8B8" font-size="16">9.8 km · 2 h 10</text>
    <rect x="14" y="1008" width="420" height="16" rx="6" fill="#0A1725"/>
    <rect x="14" y="1008" width="271.4" height="16" rx="6" fill="#5FD3C4"/>
