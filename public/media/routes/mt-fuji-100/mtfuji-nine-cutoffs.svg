<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1540" viewBox="0 0 360 1540" role="img" aria-labelledby="title desc">
  <title id="title">Mt.FUJI 100 2026: nine cut-off points from F1 to the finish</title>
  <desc id="desc">Nine cards list the 2026 FUJI100mi cut-offs in order: F1 Fujinomiya at 25.8 km, 527 m, in 22:30 on 24 April with no exit time; F2 Fumoto at 52.4 km, 818 m, in 05:50 and out 06:00 on 25 April; F3 Shojiko at 74.0 km, 922 m, 14:00 and 14:10; F4 Hanamaruki at 96.9 km, 864 m, 17:20 and 17:30; F5 Oshino at 113.2 km, 933 m, 21:30 and 21:40; F6 Yamanakako Kirara at 122.5 km, 984 m, in 02:30 and out 02:40 on 26 April; F7 Nijumagari at 136.9 km, 1,144 m, no entrance time and out 06:00; F8 Fujiyoshida at 148.4 km, 740 m, 10:00 and 10:10; and the finish at Fujisan GX Stadium, 167.0 km, 1,007 m, in 14:30 with no exit time. The start at 0 km is not counted among these nine cut-offs. F1 and the finish have one gate only, F7 has no entrance time and is generally not a retirement point. The 2026 table must not be applied to 2027, whose station table is not published. Elevations are GPX waypoint values for orientation only. The cards are schematic and are not a map, profile or navigation aid.</desc>
