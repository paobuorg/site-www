<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">QMT135 2026 官方 11 段赛道结构</title>
  <desc id="desc">QMT135 从 Baie-Saint-Paul 到 Mont-Sainte-Anne 的 11 个官方剖面分段，按等宽卡片展示每段距离和该段累计爬升。它是结构示意，不是逐点海拔剖面，也不代表 2027 已确认赛道。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0D1926"/>
      <stop offset="1" stop-color="#08131A"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1761A8"/>
      <stop offset="1" stop-color="#45E0BF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1480" cy="80" r="230" fill="#08B89D" opacity="0.08"/>
