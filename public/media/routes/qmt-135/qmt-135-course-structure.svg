  <text x="60" y="176" fill="#91A8B8" font-family="Inter, 'Segoe UI', 'Noto Sans SC', sans-serif" font-size="20">官方 2026 静态剖面的 11 个补给/节点段 · 等宽排列，不代表实际距离比例</text>
