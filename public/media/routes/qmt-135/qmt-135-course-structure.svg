    <text x="60" y="890" fill="#91A8B8" font-size="18">逐段 D+ 相加 = 5,944 m，与官方总爬升 6,000 m 差 56 m；每段 D+ 为官方图件整数，差値未分摊。距离按官方剖面与页面 134 km 对齐。</text>
    <text x="60" y="924" fill="#F56765" font-size="18" font-weight="600">这是结构示意，不是逐点海拔剖面，也不是测绘地图；不能据此导航，也不代表 2027 已确认赛道。</text>
