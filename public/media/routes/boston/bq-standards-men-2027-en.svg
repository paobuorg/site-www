    <text x="40" y="666" font-size="12.5" fill="#4b5563">Official BAA 2027/2028 standards; women's and non-binary standards are 30 minutes slower than the men's standard at every age band (e.g. 3:25:00 at 18-34). Meeting the standard only permits applying; entry also depends on field size and the cut-off. Self-made chart, not an official course profile.</text>
