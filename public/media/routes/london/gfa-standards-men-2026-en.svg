    <text x="40" y="666" font-size="12.5" fill="#4b5563">Official London Marathon 2026 GFA men's standards; women's standards are slower at each band (e.g. 3:38:00 at 18-39). GFA is UK-residents only, capped at 6,000; meeting the time only permits applying, and places are allocated fastest-first. The proof must be an in-person certified marathon (UKA/AIMS/national governing body) run between 1 Oct 2024 and 30 Sep 2025. Self-made chart, not an official course profile.</text>
