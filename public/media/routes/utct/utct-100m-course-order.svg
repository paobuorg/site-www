<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">UTCT 100 英里 13 个官方顺序节点</title>
  <desc id="desc">UTCT 100 英里从 Gardens Rugby Club 出发，按官方描述经过 Kloof Corner 与桌山北壁、Llandudno、Hout Bay、Silvermine、Kalk Bay、Simon's Town、Scarborough、Kommetjie、Noordhoek、UCT 与 King's Blockhouse，再回到 Gardens。卡片等宽，不代表距离比例，也不是可导航轨迹。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08131A"/>
      <stop offset="0.55" stop-color="#0D1926"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1490" cy="70" r="230" fill="#5FD3C4" opacity="0.07"/>
  <circle cx="90" cy="945" r="250" fill="#F4B860" opacity="0.06"/>

