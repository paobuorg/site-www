<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">UTCT 100 英里五套爬升数字</title>
  <desc id="desc">2026 UTCT 100 英里同时流通五套爬升数字：官方卡片 7,187 米、同页描述 7,516 米、ITRA 转载的组委会描述 7,850 米、ITRA 赛事详情表 6,995 米、Sportraxs 计时卡片 9,004 米。图表并列展示，不取平均，也不把最高值当作官方值。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08131A"/>
      <stop offset="0.55" stop-color="#0D1926"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <circle cx="1290" cy="80" r="210" fill="#F4B860" opacity="0.07"/>
  <circle cx="80" cy="840" r="230" fill="#5FD3C4" opacity="0.06"/>

  <g font-family="Inter, 'Segoe UI', 'Noto Sans SC', sans-serif">
    <text x="60" y="58" fill="#F4B860" font-size="20" font-weight="700" letter-spacing="4">UTCT 100 MILE / CLIMB FIGURES</text>
    <text x="60" y="114" fill="#F4FFFC" font-size="42" font-weight="750">100 英里爬升：五个数字并列</text>
    <text x="60" y="156" fill="#91A8B8" font-size="19">2026 同一个组别，6,995–9,004 m 同时流通；不取平均，也不把最高值当官方值。</text>
  </g>

  <!-- axis -->
  <g font-family="Inter, 'Segoe UI', 'Noto Sans SC', sans-serif">
    <line x1="540" y1="210" x2="1260" y2="210" stroke="#25485F" stroke-width="1"/>
    <line x1="540" y1="660" x2="1260" y2="660" stroke="#25485F" stroke-width="1"/>
    <g fill="#6F8797" font-size="13" text-anchor="middle">
      <text x="540" y="232">0</text>
      <text x="684" y="232">2,000</text>
      <text x="828" y="232">4,000</text>
      <text x="972" y="232">6,000</text>
      <text x="1116" y="232">8,000</text>
      <text x="1260" y="232">10,000 m</text>
    </g>
    <g stroke="#1B3444" stroke-width="1">
      <line x1="684" y1="210" x2="684" y2="660"/>
      <line x1="828" y1="210" x2="828" y2="660"/>
      <line x1="972" y1="210" x2="972" y2="660"/>
      <line x1="1116" y1="210" x2="1116" y2="660"/>
      <line x1="1260" y1="210" x2="1260" y2="660"/>
    </g>
  </g>

  <!-- rows -->
  <g font-family="Inter, 'Segoe UI', 'Noto Sans SC', sans-serif">
    <!-- row 1 y 260 -->
    <text x="60" y="280" fill="#F4FFFC" font-size="21" font-weight="650">官方 100 英里卡片</text>
    <text x="60" y="306" fill="#91A8B8" font-size="15">163 km · 同页第一方卡片值</text>
    <rect x="540" y="250" width="517" height="54" rx="10" fill="#5FD3C4"/>
    <text x="1075" y="286" fill="#F4FFFC" font-size="25" font-weight="700">7,187 m</text>

    <!-- row 2 y 350 -->
    <text x="60" y="370" fill="#F4FFFC" font-size="21" font-weight="650">官方 100 英里页开头</text>
    <text x="60" y="396" fill="#91A8B8" font-size="15">163 km · 同页描述值</text>
    <rect x="540" y="340" width="541" height="54" rx="10" fill="#8DE0D3"/>
    <text x="1099" y="376" fill="#F4FFFC" font-size="25" font-weight="700">7,516 m</text>

    <!-- row 3 y 440 -->
    <text x="60" y="460" fill="#F4FFFC" font-size="21" font-weight="650">ITRA 转载组委会描述</text>
    <text x="60" y="486" fill="#91A8B8" font-size="15">163.44 km · 半官方转载</text>
    <rect x="540" y="430" width="565" height="54" rx="10" fill="#F4B860"/>
    <text x="1123" y="466" fill="#F4FFFC" font-size="25" font-weight="700">7,850 m</text>

    <!-- row 4 y 530 -->
    <text x="60" y="550" fill="#F4FFFC" font-size="21" font-weight="650">ITRA 赛事详情表</text>
    <text x="60" y="576" fill="#91A8B8" font-size="15">163.44 km · 登记值</text>
    <rect x="540" y="520" width="504" height="54" rx="10" fill="#F0D48A"/>
    <text x="1062" y="556" fill="#F4FFFC" font-size="25" font-weight="700">6,995 m</text>

    <!-- row 5 y 620 -->
    <text x="60" y="640" fill="#F4FFFC" font-size="21" font-weight="650">Sportraxs 2026 计时卡片</text>
    <text x="60" y="666" fill="#F08A7A" font-size="15">161 km · 结算页卡片，非官方赛道页</text>
    <rect x="540" y="610" width="648" height="54" rx="10" fill="#F08A7A"/>
    <text x="1206" y="646" fill="#F4FFFC" font-size="25" font-weight="700">9,004 m</text>
  </g>

  <g font-family="Inter, 'Segoe UI', 'Noto Sans SC', sans-serif">
    <line x1="60" y1="728" x2="1340" y2="728" stroke="#25485F" stroke-width="1"/>
    <text x="60" y="762" fill="#B9CBD7" font-size="16">读法：官方卡片与同页描述都是第一方数字，冲突保留；ITRA 的 7,850 m 来自其转载的组委会描述，+6,995 m 来自赛事详情表。</text>
    <text x="60" y="790" fill="#B9CBD7" font-size="16">Sportraxs 的 161 km / 9,004 m 是计时平台赛事卡片，和官方 163 km / 7,187 m 不可互换。最高条不代表最权威。</text>
    <text x="60" y="818" fill="#91A8B8" font-size="15">这张图只比较已读到的数字，不判断哪一个是“真实爬升”；比赛日仍以官方 briefing 与当届赛道说明为准。</text>
    <text x="60" y="852" fill="#6F8797" font-size="14">图：跑起来编辑部，2026-11-22。来源：官方 100 英里页、ITRA 2026 100 英里页、Sportraxs 2026 计时卡片。</text>
  </g>
</svg>
