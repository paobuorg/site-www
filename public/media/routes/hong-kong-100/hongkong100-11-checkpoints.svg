  <g font-family="Inter, 'Segoe UI', 'Noto Sans SC', sans-serif">
    <text x="14" y="1312" fill="#6E8494" font-size="13">Row 1 is “SP–East Dam”; course text calls it CP1. From Sai Wan</text>
    <text x="14" y="1332" fill="#6E8494" font-size="13">Pavilion onward, table CP numbers are one lower than the text.</text>
    <text x="14" y="1352" fill="#6E8494" font-size="13">No dates are printed. Table ends at 96 km; race card says 100 km.</text>
    <text x="14" y="1372" fill="#6E8494" font-size="13">Both figures are reported; the 4 km gap is unexplained.</text>
