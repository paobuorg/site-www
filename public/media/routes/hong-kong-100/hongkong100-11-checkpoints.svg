<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1380" viewBox="0 0 480 1380" role="img" aria-labelledby="title desc">
  <title id="title">Hong Kong 100 2027: eleven rows in the official checkpoint table</title>
  <desc id="desc">Eleven equal-width cards in the order of the 2027 official checkpoint table image, from SP-East Dam at 10 km to the Finish at 96 km. Each card gives the label used by the table, the CP number used in the course text, segment and cumulative distance, stage gain and loss, and the printed opening and closing clock times. The cards are not a map, not a distance-scaled profile and not navigable. The image uses SP for East Dam and numbers later checkpoints one lower than the course text; both labels are shown. The table ends at 96 km while the race card still says 100 km.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="480" y2="1380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07121A"/>
      <stop offset="0.55" stop-color="#0D1926"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
  </defs>
  <rect width="480" height="1380" fill="url(#bg)"/>
  <circle cx="430" cy="58" r="120" fill="#F4B860" opacity="0.06"/>
  <circle cx="40" cy="1320" r="110" fill="#5FD3C4" opacity="0.05"/>
  <g font-family="Inter, 'Segoe UI', 'Noto Sans SC', sans-serif">
    <text x="14" y="38" fill="#F4B860" font-size="16" font-weight="700" letter-spacing="2">HONG KONG 100 / 2027</text>
    <text x="14" y="84" fill="#F4FFFC" font-size="40" font-weight="750">11 checkpoint rows</text>
    <text x="14" y="124" fill="#F4FFFC" font-size="27" font-weight="700">96.0 km · 5,142 m · 30 h</text>
    <text x="14" y="154" fill="#91A8B8" font-size="18">Official checkpoint table image · race card says 100 km</text>
    <text x="14" y="182" fill="#FFB38A" font-size="16">Opening / closing clock times exactly as printed</text>
    <text x="14" y="208" fill="#6E8494" font-size="16">Equal-width cards · not a map, profile or navigation aid</text>
  </g>
