      <rect width="5" height="88" rx="2.5" fill="#F4B860"/>
      <text x="20" y="29" fill="#F4B860" font-size="21" font-weight="800">01</text>
      <text x="56" y="29" fill="#F4FFFC" font-size="18" font-weight="700">SP–East Dam</text>
      <text x="430" y="29" fill="#F4FFFC" font-size="22" font-weight="750" text-anchor="end">10.0</text>
      <text x="56" y="55" fill="#91A8B8" font-size="16">正文 CP1 · SEG +10.0 · CUM 10.0 km</text>
      <text x="56" y="78" fill="#91A8B8" font-size="15">Gain +312 m · Loss −265 m</text>
      <text x="430" y="78" fill="#FFB38A" font-size="15" text-anchor="end">07:15 → 09:15</text>
    </g>
