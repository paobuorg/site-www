<text x="32" y="850" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#5f6b4a">第 11 段累计下降 654 m；Colomèrs 是后程大站，周日 07:00 关门。</text>
<text x="32" y="870" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="8.2" fill="#8a9189">分段边界为本页编辑粗分，不是官方分段。</text>
