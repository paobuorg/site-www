<text x="58" y="105" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#1f2a24">Vielha → Artiga de Lin</text>
<text x="328" y="105" text-anchor="end" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="700" fill="#345f46">0 → 21.0 km</text>
<text x="32" y="128" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="9.3" fill="#4f5a52">Vielha 982 m · Tuc Montcorbison 2,158 m</text>
