<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1122" viewBox="0 0 360 1122" role="img" aria-label="Val d'Aran by UTMB 2027 VDA six terrain bands with official checkpoints, elevations and cut-off times">
<rect width="360" height="1122" fill="#fcfbf7"/>
