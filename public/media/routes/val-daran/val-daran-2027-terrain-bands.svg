<text x="58" y="925" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#1f2a24">Colomèrs → Vielha</text>
<text x="328" y="925" text-anchor="end" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="9.2" font-weight="700" fill="#345f46">134.2 → 163.0 km</text>
<text x="32" y="948" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="9.3" fill="#4f5a52">Mont-Romies 1,765 m · Arties 1,139 m</text>
