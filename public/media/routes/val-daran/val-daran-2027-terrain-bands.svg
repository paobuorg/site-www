<text x="32" y="522" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#6f6650">下到全程最低的计时点；Bossòst 有热食、存包与休息。</text>
<text x="32" y="542" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="8.2" fill="#8a9189">分段边界为本页编辑粗分，不是官方分段。</text>
