<text x="32" y="980" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="9.3" fill="#4f5a52">终点 Vielha 982 m</text>
<line x1="32" y1="994" x2="328" y2="994" stroke="#eee8db" stroke-width="1"/>
<text x="32" y="1014" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#345f46">最后 8.2 km 累计下降 1,238 m；终点周日 16:00 关门。</text>
<text x="32" y="1034" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="8.2" fill="#8a9189">分段边界为本页编辑粗分，不是官方分段。</text>
<line x1="20" y1="1074" x2="340" y2="1074" stroke="#d8d0c0" stroke-width="1"/>
<text x="20" y="1090" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="8.4" fill="#5d675f">海拔 609–2,551 m 为官方 track；最高命名点 Pòrt d'Urets 2,520 m。</text>
<text x="20" y="1104" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="8.2" fill="#8a9189">横向长度不成比例；不画地图、轨迹或海拔剖面，GPX 仅外链官方入口。</text>
