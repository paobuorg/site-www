<text x="32" y="686" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#8b5e52">第 8 段 +1,521 m，全程爬升最多；最高命名点 2,520 m。</text>
<text x="32" y="706" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="8.2" fill="#8a9189">分段边界为本页编辑粗分，不是官方分段。</text>
