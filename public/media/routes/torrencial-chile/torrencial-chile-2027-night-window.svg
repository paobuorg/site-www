<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-label="Torrencial Chile 2027 22-hour window with 2026 legacy cutoff cells flagged">
<rect width="360" height="420" fill="#fcfbf7"/><text x="20" y="28" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12.6" font-weight="700" fill="#1f2a24" text-anchor="start">Torrencial Chile 100K 2027 · 22 小时窗口</text><text x="20" y="45" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="7.9" font-weight="400" fill="#5d675f" text-anchor="start">Start Thursday 22:00 · finish Friday 20:00 · 2027 intermediate cut-offs unknown</text><text x="20" y="59" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="7.4" font-weight="400" fill="#5d675f" text-anchor="start">Four cells in the official table still carry 2026 dates; they are not 2027 cut-offs.</text><line x1="20" y1="73" x2="340" y2="73" stroke="#d8d0c0" stroke-width="1"/><line x1="40" y1="145" x2="328" y2="145" stroke="#d8d0c0" stroke-width="7"/><line x1="40" y1="145" x2="118.54545454545453" y2="145" stroke="#416f8e" stroke-width="4"/><line x1="118.54545454545453" y1="145" x2="223.27272727272728" y2="145" stroke="#7d98aa" stroke-width="4"/><line x1="223.27272727272728" y1="145" x2="328" y2="145" stroke="#a85c3a" stroke-width="4"/><circle cx="40" cy="145" r="4" fill="#416f8e"/><text x="40" y="167" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="7" font-weight="400" fill="#5d675f" text-anchor="middle">Thu 22:00</text><text x="40" y="111" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="6.8" font-weight="400" fill="#5d675f" text-anchor="middle">0h</text><circle cx="118.54545454545453" cy="145" r="4" fill="#2f6b57"/><text x="118.54545454545453" y="167" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="7" font-weight="400" fill="#5d675f" text-anchor="middle">Fri 04:00</text><text x="118.54545454545453" y="111" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="6.8" font-weight="400" fill="#5d675f" text-anchor="middle">6h</text><circle cx="197.09090909090907" cy="145" r="4" fill="#2f6b57"/><text x="197.09090909090907" y="167" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="7" font-weight="400" fill="#5d675f" text-anchor="middle">Fri 10:00</text><text x="197.09090909090907" y="111" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="6.8" font-weight="400" fill="#5d675f" text-anchor="middle">12h</text><circle cx="275.6363636363636" cy="145" r="4" fill="#2f6b57"/><text x="275.6363636363636" y="167" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="7" font-weight="400" fill="#5d675f" text-anchor="middle">Fri 16:00</text><text x="275.6363636363636" y="111" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="6.8" font-weight="400" fill="#5d675f" text-anchor="middle">18h</text><circle cx="328" cy="145" r="4" fill="#a85c3a"/><text x="328" y="167" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="7" font-weight="400" fill="#5d675f" text-anchor="middle">Fri 20:00</text><text x="328" y="111" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="6.8" font-weight="400" fill="#5d675f" text-anchor="middle">22h</text><text x="20" y="208" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="7.4" font-weight="400" fill="#5d675f" text-anchor="start">Most of the race runs in darkness; headtorch and backup power are prerequisites.</text><rect x="32" y="228" width="296" height="120" rx="6" fill="#f1f1ed" stroke="#d7d7cf" stroke-width="1"/><text x="42" y="247" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="8" font-weight="700" fill="#6d7068" text-anchor="start">FOUR 2026 LEGACY CELLS · NOT 2027 CUT-OFFS</text><text x="42" y="266" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="7.3" font-weight="400" fill="#6d7068" text-anchor="start">Cafetería Oncol · El Canelo · Potreros · Finish</text><text x="42" y="282" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="7.3" font-weight="400" fill="#6d7068" text-anchor="start">All four dated 2026-06-28 (Sunday) in the table,</text><text x="42" y="296" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="7.3" font-weight="400" fill="#6d7068" text-anchor="start">while 2027 starts Thursday 22:00. The dates do not reconcile.</text><text x="42" y="318" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="7.3" font-weight="700" fill="#a85c3a" text-anchor="start">Treat every intermediate cut-off as unknown until the 2027 manual.</text><line x1="20" y1="392" x2="340" y2="392" stroke="#d8d0c0" stroke-width="1"/><text x="20" y="406" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="7.4" font-weight="400" fill="#5d675f" text-anchor="start">Time window only · not a course profile · 2027 cut-offs not published</text></svg>
