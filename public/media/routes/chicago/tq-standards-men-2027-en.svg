    <text x="40" y="666" font-size="12.5" fill="#4b5563">Official Chicago Marathon 2027 Time Qualifier men's standards; women's and non-binary standards are slower at each band (e.g. 3:20:00 at 16-34). Proof must be a USATF/WA-certified marathon run between 1 Jan 2025 and 29 Oct 2026; half-marathon or 50K times are not accepted. Meeting the standard earns a guaranteed entry, separate from the non-guaranteed Drawing. Self-made chart, not an official course profile.</text>
