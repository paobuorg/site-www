<text x="20" y="972" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="8.2" fill="#8a9189">横向长度不成比例；不画地图、轨迹或海拔剖面，GPX 仅外链官方入口。</text>
