      <text x="430" y="25" fill="#F4FFFC" font-size="20" font-weight="750" text-anchor="end">23.8 km</text>
      <text x="52" y="50" fill="#91A8B8" font-size="13">From last 10 km · To finish 77.5 km · Spectators/Drop N / N</text>
      <text x="52" y="73" fill="#FFB38A" font-size="13">Cut-off 02:30PM</text>
      <text x="430" y="73" fill="#6E8494" font-size="12" text-anchor="end">no spectators</text>
      <text x="52" y="94" fill="#91A8B8" font-size="12">Water · Näak · waffles · gels · food</text>
    </g>
    <g transform="translate(14,556)">
      <rect width="452" height="100" rx="12" fill="#0E1C2B" stroke="#20374A"/>
      <rect width="5" height="100" rx="2.5" fill="#5FD3C4"/>
      <text x="20" y="25" fill="#5FD3C4" font-size="18" font-weight="800">04</text>
      <text x="52" y="25" fill="#F4FFFC" font-size="17" font-weight="700">Six Foot Track Outbound</text>
      <text x="430" y="25" fill="#F4FFFC" font-size="20" font-weight="750" text-anchor="end">37.3 km</text>
      <text x="52" y="50" fill="#91A8B8" font-size="13">From last 13.5 km · To finish 64 km · Spectators/Drop Y / Y</text>
      <text x="52" y="73" fill="#FFB38A" font-size="13">Cut-off 05:20PM</text>
      <text x="430" y="73" fill="#6E8494" font-size="12" text-anchor="end">spectators + drop bags</text>
      <text x="52" y="94" fill="#91A8B8" font-size="12">Water · Näak · waffles · gels · food</text>
    </g>
    <g transform="translate(14,664)">
      <rect width="452" height="100" rx="12" fill="#0E1C2B" stroke="#20374A"/>
