  <g font-family="Inter, 'Segoe UI', 'Noto Sans SC', sans-serif">
    <text x="14" y="1340" fill="#F4B860" font-size="16" font-weight="700">Final limit: 28 h after the last starter</text>
    <text x="14" y="1364" fill="#91A8B8" font-size="13">Last wave 08:30 → 12:30 Sunday = 28 h; first wave 05:00 gets 31 h 30 min.</text>
    <text x="14" y="1386" fill="#6E8494" font-size="13">Tarros 12:30PM is 4 h after an 08:30 start and 7 h 30 min after 05:00.</text>
    <text x="14" y="1408" fill="#6E8494" font-size="13">Queen Victoria Hospital prints “05:5AM”, not a valid four-digit time.</text>
    <text x="14" y="1430" fill="#6E8494" font-size="13">Presented as a 2027 draft; schedule page is labelled subject to change.</text>
    <text x="14" y="1462" fill="#6E8494" font-size="12">Editorial graphic. Not an official map, profile or race-day image.</text>
  </g>
</svg>
