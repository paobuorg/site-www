      <text x="52" y="94" fill="#91A8B8" font-size="12">Water only</text>
    </g>
    <g transform="translate(14,772)">
      <rect width="452" height="100" rx="12" fill="#0E1C2B" stroke="#20374A"/>
      <rect width="5" height="100" rx="2.5" fill="#5FD3C4"/>
      <text x="20" y="25" fill="#5FD3C4" font-size="18" font-weight="800">06</text>
      <text x="52" y="25" fill="#F4FFFC" font-size="17" font-weight="700">Katoomba Aquatic Centre</text>
      <text x="430" y="25" fill="#F4FFFC" font-size="20" font-weight="750" text-anchor="end">56.2 km</text>
      <text x="52" y="50" fill="#91A8B8" font-size="13">From last 10.5 km · To finish 45.1 km · Spectators/Drop Y / Y</text>
      <text x="52" y="73" fill="#FFB38A" font-size="13">Cut-off 10:20PM</text>
      <text x="430" y="73" fill="#6E8494" font-size="12" text-anchor="end">flushing toilets</text>
      <text x="52" y="94" fill="#91A8B8" font-size="12">Water · Näak · waffles · hot food</text>
    </g>
    <g transform="translate(14,880)">
      <rect width="452" height="100" rx="12" fill="#0E1C2B" stroke="#20374A"/>
      <rect width="5" height="100" rx="2.5" fill="#5FD3C4"/>
      <text x="20" y="25" fill="#5FD3C4" font-size="18" font-weight="800">07</text>
      <text x="52" y="25" fill="#F4FFFC" font-size="17" font-weight="700">Fairmont Resort</text>
      <text x="430" y="25" fill="#F4FFFC" font-size="20" font-weight="750" text-anchor="end">68.3 km</text>
      <text x="52" y="50" fill="#91A8B8" font-size="13">From last 12.1 km · To finish 33 km · Spectators/Drop Y / N</text>
      <text x="52" y="73" fill="#FFB38A" font-size="13">Cut-off 02:05PM Sun</text>
      <text x="430" y="73" fill="#6E8494" font-size="12" text-anchor="end">Leura side</text>
      <text x="52" y="94" fill="#91A8B8" font-size="12">Water · Näak · waffles · gels · hot food</text>
    </g>
    <g transform="translate(14,988)">
      <rect width="452" height="100" rx="12" fill="#0E1C2B" stroke="#20374A"/>
      <rect width="5" height="100" rx="2.5" fill="#5FD3C4"/>
      <text x="20" y="25" fill="#5FD3C4" font-size="18" font-weight="800">08</text>
      <text x="52" y="25" fill="#F4FFFC" font-size="17" font-weight="700">Queen Victoria Hospital</text>
      <text x="430" y="25" fill="#F4FFFC" font-size="20" font-weight="750" text-anchor="end">79.3 km</text>
      <text x="52" y="50" fill="#91A8B8" font-size="13">From last 11 km · To finish 22 km · Spectators/Drop Y / Y</text>
      <text x="52" y="73" fill="#FFB38A" font-size="13">Cut-off 05:5AM Sun</text>
      <text x="430" y="73" fill="#6E8494" font-size="12" text-anchor="end">printed 05:5AM, not 05:55</text>
