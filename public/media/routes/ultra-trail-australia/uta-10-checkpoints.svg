      <text x="20" y="25" fill="#5FD3C4" font-size="18" font-weight="800">05</text>
      <text x="52" y="25" fill="#F4FFFC" font-size="17" font-weight="700">Six Foot Track Water Point</text>
      <text x="430" y="25" fill="#F4FFFC" font-size="20" font-weight="750" text-anchor="end">45.7 km</text>
      <text x="52" y="50" fill="#91A8B8" font-size="13">From last 8.4 km · To finish 55.6 km · Spectators/Drop Y / N</text>
