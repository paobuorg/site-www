      <rect width="5" height="100" rx="2.5" fill="#5FD3C4"/>
      <text x="20" y="25" fill="#5FD3C4" font-size="18" font-weight="800">09</text>
      <text x="52" y="25" fill="#F4FFFC" font-size="17" font-weight="700">Emergency Aid Station</text>
      <text x="430" y="25" fill="#F4FFFC" font-size="20" font-weight="750" text-anchor="end">92.5 km</text>
      <text x="52" y="50" fill="#91A8B8" font-size="13">From last 13.2 km · To finish 8.8 km · Spectators/Drop N / N</text>
