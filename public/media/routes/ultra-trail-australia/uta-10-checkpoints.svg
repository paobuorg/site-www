      <rect width="5" height="100" rx="2.5" fill="#F4B860"/>
      <text x="20" y="25" fill="#F4B860" font-size="18" font-weight="800">10</text>
      <text x="52" y="25" fill="#F4FFFC" font-size="17" font-weight="700">Scenic World (finish)</text>
      <text x="430" y="25" fill="#F4FFFC" font-size="20" font-weight="750" text-anchor="end">101.3 km</text>
      <text x="52" y="50" fill="#91A8B8" font-size="13">From last 8.8 km · To finish 0 km · Spectators/Drop Y / Y</text>
      <text x="52" y="73" fill="#FFB38A" font-size="13">Cut-off 12:30PM Sun</text>
      <text x="430" y="73" fill="#6E8494" font-size="12" text-anchor="end">after 951 Furber Steps</text>
      <text x="52" y="94" fill="#91A8B8" font-size="12">Water · hot meal</text>
    </g>
