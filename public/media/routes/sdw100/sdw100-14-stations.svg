<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1580" viewBox="0 0 480 1580" role="img" aria-labelledby="title desc">
  <title id="title">South Downs Way 100 2027: fourteen route points in official order</title>
  <desc id="desc">Fourteen equal-width cards from the Start at Matterley Bowl at 0.0 miles to the Finish at Eastbourne at 100.0 miles, with the twelve numbered aid stations between them. Each card gives the segment distance, cumulative mileage, cumulative kilometres, Wave 1 and Wave 2 leave-by times, and crew or hot-food notes. Houghton Farm is at 47.3 miles in the 2027 chart. The cards are not a map, not distance-scaled and not navigable. Cut-offs are leave-by limits, not target paces.</desc>
