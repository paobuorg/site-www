      <rect x="100" y="1" width="211" height="16" rx="4" fill="#5FD3C4" opacity="0.9"/>
      <text x="432" y="15" fill="#F4FFFC" font-size="17" font-weight="750" text-anchor="end">5.24</text>
    </g>
    <g transform="translate(0,734)">
      <text x="14" y="10" fill="#F4FFFC" font-size="16" font-weight="700">11→12</text>
      <text x="14" y="26" fill="#6E8494" font-size="12">4.1 mi</text>
      <rect x="100" y="1" width="213" height="16" rx="4" fill="#5FD3C4" opacity="0.9"/>
      <text x="432" y="15" fill="#F4FFFC" font-size="17" font-weight="750" text-anchor="end">5.28</text>
    </g>
    <g transform="translate(0,782)">
      <text x="14" y="10" fill="#F4FFFC" font-size="16" font-weight="700">12→F</text>
      <text x="14" y="26" fill="#6E8494" font-size="12">4.3 mi</text>
      <rect x="100" y="1" width="224" height="16" rx="4" fill="#5FD3C4" opacity="0.9"/>
      <text x="432" y="15" fill="#F4FFFC" font-size="17" font-weight="750" text-anchor="end">5.54</text>
    </g>
    <text x="14" y="866" fill="#F4B860" font-size="14">4.49 = Cocking→Houghton (10.7 mi / 3:50)</text>
    <text x="14" y="886" fill="#FF7A6B" font-size="14">7.43 = Houghton→Washington (7.7 mi / 1:40)</text>
    <text x="14" y="908" fill="#6E8494" font-size="13">2027 Houghton = 47.3 mi, Wave 1 cut-off 20:20; 2026 = 45.0 mi.</text>
  </g>
</svg>
