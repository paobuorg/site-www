      <text x="432" y="15" fill="#F4FFFC" font-size="17" font-weight="750" text-anchor="end">5.50</text>
    </g>
    <g transform="translate(0,590)">
      <text x="14" y="10" fill="#F4FFFC" font-size="16" font-weight="700">8→9</text>
      <text x="14" y="26" fill="#6E8494" font-size="12">10.0 mi</text>
      <rect x="100" y="1" width="223" height="16" rx="4" fill="#5FD3C4" opacity="0.9"/>
